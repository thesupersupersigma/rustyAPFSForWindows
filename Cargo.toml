[package]
name = "rusty-apfs"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "APFS reader (and, later, writer) for Windows"

[lib]
name = "rusty_apfs"

[[bin]]
name = "apfs"
path = "src/main.rs"

[dependencies]
aes = "0.9.3"
aes-kw = "0.3.1"
caseless = "0.2.2"
flate2 = "1.1.10"
hmac = "0.13.0"
lzfse_rust = "0.2.1"
pbkdf2 = "0.13.0"
sha2 = "0.11.1"
unicode-normalization = "0.1.26"
xts-mode = "0.6.0"

[target."cfg(windows)".dependencies]
winfsp = "0.13.2"

[target."cfg(windows)".build-dependencies]
winfsp = "0.13.2"
